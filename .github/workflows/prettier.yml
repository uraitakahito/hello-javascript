# Checks that every file Prettier knows about is formatted. ESLint enforces
# Prettier only on JavaScript files (through prettier/prettier), so YAML, JSONC
# and Markdown would otherwise drift unnoticed (see PR #212).

name: prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # v6.0.2 - https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        # v7.1.0 - https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Run prettier --check
        run: npm run format:check
